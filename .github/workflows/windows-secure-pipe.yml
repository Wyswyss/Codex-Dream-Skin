name: Windows secure pipe checks

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    paths:
      - ".github/workflows/windows-secure-pipe.yml"
      - "windows/**"
      - "docs/platforms.md"
      - "README.md"
      - "README.en.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Run Windows regression suite
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows/tests/run-tests.ps1
